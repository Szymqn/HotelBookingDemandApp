services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    build: .
    container_name: web
    command: sh -c "python manage.py collectstatic --noinput && gunicorn HotelBookingDemandApp.wsgi:application --workers 1 --threads 2 --bind 0.0.0.0:8000 --max-requests 1000 --max-requests-jitter 50"
    env_file: .env
    environment:
      - BASE_PATH=/sk84647
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - static_volume:/app/staticfiles
      - ml_volume:/app/ml_model
    healthcheck:
      test: ["CMD", "curl", "http://127.0.0.1:8000/sk84647/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M

  celery:
    build: .
    container_name: celery
    command: celery -A HotelBookingDemandApp worker -l info
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ml_volume:/app/ml_model
    deploy:
      resources:
        limits:
          memory: 1024M

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  static_volume:
  ml_volume: